name: Build HCW Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "buildozer.spec"
      - "assets/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout HCW
        uses: actions/checkout@v7

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext libltdl-dev build-essential patch ccache

      - name: Prepare Python and Buildozer
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install git+https://github.com/kivy/buildozer
          python -m pip install legacy-cgi setuptools cython==0.29.34

      - name: Verify source and assets
        run: |
          python -m py_compile main.py
          test -s assets/hcw_intro.png
          test -s assets/hcw_app_icon.png
          grep -q "source.include_exts = py,png" buildozer.spec
          grep -q "source.include_patterns = main.py,assets/\*.png" buildozer.spec
          grep -q "presplash.filename = %(source.dir)s/assets/hcw_intro.png" buildozer.spec
          grep -q "icon.filename = %(source.dir)s/assets/hcw_app_icon.png" buildozer.spec
          grep -q "android.api = 36" buildozer.spec
          grep -q "android.ndk = 29" buildozer.spec
          grep -q "android.archs = arm64-v8a" buildozer.spec
          grep -q "android.release_artifact = apk" buildozer.spec

      - name: Restore permanent HCW signing key
        env:
          HCW_KEYSTORE_BASE64: ${{ secrets.HCW_KEYSTORE_BASE64 }}
          HCW_KEYSTORE_PASSWORD: ${{ secrets.HCW_KEYSTORE_PASSWORD }}
          HCW_KEY_ALIAS: ${{ secrets.HCW_KEY_ALIAS }}
        run: |
          test -n "$HCW_KEYSTORE_BASE64"
          test -n "$HCW_KEYSTORE_PASSWORD"
          test -n "$HCW_KEY_ALIAS"
          printf '%s' "$HCW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hcw-release-key.jks"
          chmod 600 "$RUNNER_TEMP/hcw-release-key.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/hcw-release-key.jks" \
            -storepass "$HCW_KEYSTORE_PASSWORD" \
            -alias "$HCW_KEY_ALIAS" >/dev/null

      - name: Build permanently signed Android APK
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/hcw-release-key.jks
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.HCW_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.HCW_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.HCW_KEY_PASSWORD }}
        run: |
          buildozer -v android release

      - name: Verify APK and signature
        run: |
          ls -lah bin/
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$HOME/.buildozer/android/platform/android-sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed HCW APK
        uses: actions/upload-artifact@v4
        with:
          name: HCW-Signed-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
